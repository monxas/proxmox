services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - /home/monxas/appdata/nginx/conf.d:/etc/nginx/conf.d
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "80:80"
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/radarr:/config
      - /mnt/nfs_media:/data
    ports:
      - "7878:7878"
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/sonarr:/config
      - /mnt/nfs_media:/data
    ports:
      - "8989:8989"
    restart: always

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/lidarr:/config
      - /mnt/nfs_media:/data
    ports:
      - "8686:8686"
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/bazarr:/config
      - /mnt/nfs_media/movies:/movies #optional
      - /mnt/nfs_media/tvshows:/tv #optional
    ports:
      - "6767:6767"
    restart: always

  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/readarr:/config
      - /mnt/nfs_media:/data
    ports:
      - "8787:8787"
    restart: always

  sonarr_monitor:
    image: monxas/putio-torrent-monitor:latest
    container_name: sonarr_monitor
    environment:
      - PARENT_ID=1244743180
      - PUTIO_OAUTH_TOKEN=I5RCKVANJ6HJME4TPLKR
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /mnt/nfs_media/torrents/sonarr:/torrents
    restart: unless-stopped

  radarr_monitor:
    image: monxas/putio-torrent-monitor:latest
    container_name: radarr_monitor
    environment:
      - PARENT_ID=1244692884
      - PUTIO_OAUTH_TOKEN=I5RCKVANJ6HJME4TPLKR
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /mnt/nfs_media/torrents/radarr:/torrents
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/jellyfin:/config
      - /mnt/nfs_media:/data
    ports:
      - "8096:8096"
      - "8920:8920"
    restart: always

  jellystat-db:
      image: postgres:15.2
      container_name: jellystat-db
      environment:
        POSTGRES_DB: 'jfstat'
        POSTGRES_USER: 'postgres'
        POSTGRES_PASSWORD: 'mypassword'  # Consider using Docker secrets or an env file for production
        TZ: 'Europe/Madrid'  # Setting timezone for consistency, though not used by PostgreSQL image
      volumes:
        - /home/monxas/appdata/jellystat-db:/var/lib/postgresql/data
      restart: always

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'mypassword'  # Consider using Docker secrets or an env file for production
      POSTGRES_IP: 'jellystat-db'
      POSTGRES_PORT: '5432'
      JWT_SECRET: 'my-secret-jwt-key'  # Consider using Docker secrets or an env file for production
      TZ: 'Europe/Madrid'
      PUID: '1000'
      PGID: '1000'
    ports:
      - "3100:3000"
    volumes:
      - /home/monxas/appdata/jellystat-backup:/app/backend/backup-data
    depends_on:
      - jellystat-db
    restart: always

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/prowlarr:/config
    ports:
      - "9696:9696"
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
      - DOCKER_MODS=marzzzello/linuxserver-io-mod-qbit-matui
    volumes:
      - /home/monxas/appdata/qbittorrent:/config
      - /mnt/nfs_media:/data
    ports:
      - "8080:8080"
    restart: always

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    restart: always

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_CLEANUP=true
      - TZ=Europe/Madrid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/heimdall:/config
    ports:
      - "8084:80"
    restart: always

  whatsupdocker:
    image: fmartinou/whats-up-docker
    container_name: wud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WUD_REGISTRY_LSCR_TOKEN=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
    ports:
      - "3000:3000"
    restart: always

  stirling-pdf:
    container_name: pdf
    image: frooodle/s-pdf
    ports:
      - "9090:8080"
    volumes:
      - /home/monxas/appdata/pdf/trainingData:/usr/share/tesseract-ocr/4.00/tessdata 
      - /home/monxas/appdata/pdf/config:/configs
    environment:
      APP_LOCALE: es_ES
      APP_HOME_NAME: Stirling PDF
      APP_HOME_DESCRIPTION: Your locally hosted one-stop-shop for all your PDF needs.
      APP_NAVBAR_NAME: Stirling PDF
      APP_ROOT_PATH: /
    restart: always

  changedetection:
    image: lscr.io/linuxserver/changedetection.io:latest
    container_name: changedetection
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBDRIVER_URL=http://192.168.0.208:4444/wd/hub
    volumes:
      - /home/monxas/appdata/changedetection:/config
    ports:
      - "5000:5000"
    restart: always

  selenium:
    image: selenium/standalone-chrome:latest
    environment:
      - DEBUG=browserless:*
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=20
      - PREBOOT_CHROME=true
      - DEMO_MODE=false
      - ENABLE_DEBUGGER=false
      - TOKEN=alfagann
      - WORKSPACE_DELETE_EXPIRED=true
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2g
    restart: always

  snapdrop:
    image: lscr.io/linuxserver/snapdrop:latest
    container_name: snapdrop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/monxas/appdata/snapdrop:/config
    ports:
      - "8085:80"
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/monxas/appdata/portainer:/data
    restart: always


  ydl_api_ng:
    container_name: ydl_api_ng
    image: totonyus/ydl_api_ng
    restart: unless-stopped
    depends_on:
      - ydl_api_ng_redis
    ports:
      - 5011:80
    volumes:
      - /home/monxas/appdata/ydl_api_ng/params:/app/params
      - /home/monxas/appdata/ydl_api_ng/logs:/app/logs
      - /mnt/nfs_media/nopor:/app/downloads
      - /home/monxas/appdata/ydl_api_ng/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - UID=1000
      - GID=1000
      - NB_WORKERS=5
      - LOG_LEVEL=error
      - DISABLE_REDIS=false

  ydl_api_ng_redis:
    container_name: ydl_api_ng_redis
    image: redis
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro



  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    ports:
      - "9990:9999"
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/monxas/appdata/stash/config:/root/.stash
      - /mnt/nfs_media/nopor:/data
      - /home/monxas/appdata/stash/metadata:/metadata
      - /home/monxas/appdata/stash/cache:/cache
      - /home/monxas/appdata/stash/blobs:/blobs
      - /home/monxas/appdata/stash/generated:/generated

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
      - /home/monxas/appdata/calibre-web:/config
      - /mnt/nfs_media/calibre-library:/libros
    ports:
      - 8083:8083
    restart: unless-stopped

  glance:
    container_name: glance
    image: glanceapp/glance
    ports:
      - 6080:8080
    volumes:
      - /home/monxas/appdata/glance/glance.yml:/app/glance.yml
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - PASSWORD=alfagann #optional
      - PROXY_DOMAIN=dev.monxas.casa #optional
      - DEFAULT_WORKSPACE=/config/workspace #optional
    volumes:
      - ./appdata/vscode:/config
    ports:
      - 8443:8443
    restart: unless-stopped
